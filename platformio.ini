[platformio]
default_envs = wokwi ; Cambia esto a wokwi_debug si quieres que sea el predeterminado al abrir VS Code
description = Firmware for irrigation system

[common]
firmware_version = 121
core_debug_level = 0
log_debug_level = 0
upload_speed = 460800
monitor_speed = 115200
;port = /dev/tty.wchusbserial1410
lib_deps_all =
  arduinojson = ArduinoJson @ >=6
  htu21d = enjoyneering/HTU21D
  ultrasonic = martinsos/HCSR04
  ultrasonic2 = ErickSimões/Ultrasonic
  timezone = Timezone
  preferences = Preferences
  ntpclient = NTPClient
  asyncmqttclient = marvinroger/AsyncMqttClient @ ^0.9.0
  asynctcp = me-no-dev/AsyncTCP @ ^1.1.1
  dht = beegee-tokyo/DHT sensor library for ESPx
  newping = NewPing

build_flags =
    '-DFIRMWARE_VERSION=${common.firmware_version}'
    '-DCORE_DEBUG_LEVEL=${common.core_debug_level}'
    '-DLOG_LOCAL_LEVEL=${common.log_debug_level}'
    '-fno-aggressive-loop-optimizations'

[esp32]
extends = common
framework = arduino
platform = espressif32@>4.2.0
board_build.f_cpu = 80000000L
board_build.f_flash = 80000000L

[env:lolin32]
extends = esp32
board = lolin_d32
build_flags = ${common.build_flags}
lib_deps = ${common.lib_deps_all}
upload_speed = ${common.upload_speed}
;upload_port = ${common.port}
monitor_speed = ${common.monitor_speed}
;monitor_port = ${common.port}
monitor_filters = esp32_exception_decoder

[env:esp32dev]
extends = esp32
board = esp32dev
build_flags = ${common.build_flags}
upload_speed = ${common.upload_speed}
monitor_speed = ${common.monitor_speed}
monitor_filters = esp32_exception_decoder
lib_deps = ${common.lib_deps_all}


; ---------------------------------------------------------
; Entorno NORMAL para Wokwi (Ejecución rápida, para probar la Web, etc.)
; ---------------------------------------------------------
[env:wokwi]
extends = env:esp32dev
board_build.filesystem = littlefs
; Ejecutamos el launcher ANTES (pre) y la fusión DESPUÉS (post)
extra_scripts = 
    pre:scripts/update_wokwi.py
    pre:scripts/wokwi_launcher.py
    post:scripts/extra_script.py

; ---------------------------------------------------------
; Entorno DEBUG para Wokwi (Paso a paso, Breakpoints, Línea Amarilla)
; ---------------------------------------------------------
[env:wokwi_debug]
extends = env:wokwi
build_type = debug
debug_build_flags = -O0 -ggdb3 -g3 ; Desactiva optimizaciones para ver todas las variables

; --- CONFIGURACIÓN AUTOMÁTICA GDB ---
debug_tool = custom
debug_port = localhost:1234
debug_init_break = tbreak setup  ; 
debug_init_cmds =
  target remote $DEBUG_PORT
  $INIT_BREAK
debug_extra_cmds =
  set print pretty on
  set confirm off